
name: Deploy WiSe 2026/27 website

on:
  push:
    branches:
      - "WiSe2026/27_1"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx website
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out semester branch
        uses: actions/checkout@v7
        with:
          ref: WiSe2026/27_1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build website
        run: sphinx-build -b html doc _build/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

  deploy:
    name: Deploy semester website
    if: github.ref == 'refs/heads/WiSe2026/27_1'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
